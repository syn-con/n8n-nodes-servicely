name: Publish on version change

on:
  push:
    branches: [main]
    paths:
      - "package.json" # only wake up when the version file changes
  # Lets a publish be retried without a version bump — the job is already
  # idempotent (it no-ops when the version is on the registry).
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag
      # Mints the OIDC token `npm publish --provenance` signs the package with.
      # n8n requires a provenance statement on every community node published
      # from 1 May 2026, and provenance can only be attested by a CI publish.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22+ is required to install: n8n-workflow pulls in isolated-vm 6.x,
          # a native module that compiles against V8 12.4+ APIs (Node 22 and up).
          node-version: 22
          cache: npm
          # The public registry: n8n installs a community node from npm, and a
          # package that is not there cannot be verified or offered on Cloud.
          registry-url: "https://registry.npmjs.org"

      - name: Read package info
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine publish state
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"

          # Does the package exist at all (any version)?
          if npm view "$NAME" version >/dev/null 2>&1; then
            PACKAGE_EXISTS=true
          else
            PACKAGE_EXISTS=false
          fi

          # Does this exact version already exist?
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            VERSION_EXISTS=true
          else
            VERSION_EXISTS=false
          fi

          if [ "$VERSION_EXISTS" = "true" ]; then
            echo "publish=false"     >> "$GITHUB_OUTPUT"
            echo "release_type=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already published — nothing to do."
          elif [ "$PACKAGE_EXISTS" = "false" ]; then
            echo "publish=true"       >> "$GITHUB_OUTPUT"
            echo "event=package-created" >> "$GITHUB_OUTPUT"
            echo "::notice::First publish of $NAME ($VERSION)."
          else
            echo "publish=true"        >> "$GITHUB_OUTPUT"
            echo "event=package-published" >> "$GITHUB_OUTPUT"
            echo "::notice::Update $NAME -> $VERSION."
          fi

      - name: Install
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      # The gate n8n's verification applies to the published package, applied
      # before it is published: `npm run lint` runs n8n's own node standards.
      - name: Check
        if: steps.check.outputs.publish == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # n8n's own scanner, against the version that was just published. It needs
      # a package on the registry, so it cannot gate the publish — it reports on
      # it, and a failure here is what to fix before submitting for verification.
      - name: Scan the published package
        if: steps.check.outputs.publish == 'true'
        continue-on-error: true
        run: npx --yes @n8n/scan-community-package "${{ steps.pkg.outputs.name }}"

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.pkg.outputs.version }}"
          git push origin "v${{ steps.pkg.outputs.version }}"

      - name: Notify n8n
        if: steps.check.outputs.publish == 'true'
        run: |
          curl --fail --show-error --silent \
            -X POST "https://n8n-prod.itsmcloud.lt/webhook/12ed1f70-d87f-4097-bab2-8f8d2cf007f3" \
            -H "Authentication: ${{ secrets.N8N_PROD_AUTH }}" \
            -H "Content-Type: application/json" \
            -d "{\"package\":\"${{ github.repository }}\",\"version\":\"${{ steps.pkg.outputs.version }}\",\"releaseType\":\"${{ steps.check.outputs.event }}\"}"
